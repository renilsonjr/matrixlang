name: secrets

# Scan for accidentally committed secrets on every pull request and on
# main after merge. This repo is public and the operator uses a real
# Anthropic key at runtime, so a leaked key in history would be live
# credentials on an attacker-visible tree.
#
# The cost is near zero (a single binary scan of a small repo) and it
# complements -- rather than replaces -- the local .githooks/pre-commit:
# a contributor who clones without the hook can still not merge a secret,
# because this check is required to pass.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Scan the full history, not just the tip. A secret removed in
          # the last commit can still be live in an earlier one; the
          # point is to catch whether one exists anywhere, and rewrites
          # touch the past too.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}