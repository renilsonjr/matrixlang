name: tests

# Runs on every pull request, and on main after merge.
#
# This exists because of a concrete incident: a change to
# src/matrixlang/glyphs.py rode in on a documentation pull request, nothing
# ran the suite against it, and main was left red. A required status check
# makes that merge impossible rather than merely noticeable afterwards.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version, not just the first to fail — the point of the
      # matrix is to learn which versions work, and fail-fast hides that.
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.11". Until now the
        # code had only ever run on 3.14, so that floor was a claim rather
        # than a fact. This matrix is what makes it true.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    name: python ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # No dependency caching: the package has zero third-party runtime
      # dependencies and pytest is the only dev dependency, so a cache would
      # cost more complexity than the seconds it saves.
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  # The page's own half. site/checks/ pins what playground.js must not do;
  # these pin what it must. Its own job rather than a step in the matrix
  # above: it has nothing to do with the Python version, and running it four
  # times would only make one failure look like four.
  javascript:
    runs-on: ubuntu-latest
    name: javascript

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # No install step, and no package.json: `node --test` is built in and
      # the harness has no dependencies. The glob is left unquoted so the
      # shell expands it, which works on every Node that has --test at all.
      - name: Run tests
        run: node --test site/tests/*.test.mjs
