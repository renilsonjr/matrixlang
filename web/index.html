<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatrixLang Web IDE - Live .rain Cascade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-rain-canvas"></canvas>

  <div class="app-container">
    <header>
      <div class="logo-group">
        <span class="logo-icon">ｱ</span>
        <div>
          <h1>MATRIX_LANG</h1>
          <div class="sub-tag">Esoteric Digital Rain Engine v0.5.0</div>
        </div>
      </div>

      <div class="controls">
        <select id="sample-select">
          <option value="hello">Sample: Wake Up Neo (hello.rain)</option>
          <option value="counter">Sample: Counter Loop</option>
          <option value="fibonacci">Sample: Fibonacci Sequence</option>
          <option value="glyphs">Sample: Katakana Glyphs (ｱ ﾄ ﾚ ﾌ ﾃ ﾗ)</option>
        </select>
        <button id="toggle-glyph-btn">Glyph View: Off</button>
        <button id="reset-btn">Reset</button>
        <button id="run-btn" class="btn-primary">▶ RUN (.rain)</button>
      </div>
    </header>

    <main class="main-content">
      <section class="panel">
        <div class="panel-header">
          <span>// MatrixLang Source (.rain)</span>
          <span id="char-count">0 chars</span>
        </div>
        <div class="editor-container">
          <textarea id="code-input" spellcheck="false"></textarea>
        </div>
        <div class="status-bar">
          <span id="editor-status">Ready</span>
          <span>Syntax: MatrixLang ASCII / Katakana</span>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <span>// Live Cascade Output & Rain Stream</span>
          <span id="exec-status">IDLE</span>
        </div>
        <div class="console-output" id="console-output">
          <div class="console-line">
            <span class="console-prompt">&gt;</span>
            <span class="console-text">MatrixLang Web Engine Ready. Press ▶ RUN (.rain) to execute program.</span>
          </div>
        </div>
        <div class="status-bar">
          <span id="step-count">Steps: 0</span>
          <span>Matrix Engine Active</span>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
