[project]
name = "matrixlang"
version = "0.5.0"
description = "A Matrix-styled esoteric programming language."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# OP-5. Operator's only dependency, and it is optional: `pip install
# matrixlang` stays dependency-free, and `import matrixlang.operator`
# works without it because client.py imports the SDK inside the function
# that calls it.
bot = ["anthropic>=0.40"]

[project.scripts]
matrixlang = "matrixlang.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrixlang"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
