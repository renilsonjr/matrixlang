[project]
name = "matrixlang"
version = "0.6.0"
description = "A programming language whose output is the Matrix cascade."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# OP-5. Operator's only dependency, and it is optional: `pip install
# matrixlang` stays dependency-free, and `import matrixlang.operator`
# works without it because client.py imports the SDK inside the function
# that calls it.
bot = ["anthropic>=0.40"]

[project.scripts]
matrixlang = "matrixlang.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrixlang"]
dev-mode-exact = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `server/` is deliberately NOT packaged: a top-level `server` on PyPI
# would collide with half the ecosystem. It runs from the repo root
# (`python -m server`), which is the clone-and-run model OP-13 chose, and
# this is what lets the tests import it without a conftest.
pythonpath = ["."]
